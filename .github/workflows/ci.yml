name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize]
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit Tests
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPELEODB_INSTANCE_URL: ${{ secrets.SPELEODB_INSTANCE_URL }}
      SPELEODB_OAUTH_TOKEN: ${{ secrets.SPELEODB_OAUTH_TOKEN }}
      SPELEODB_EMAIL: ${{ secrets.SPELEODB_EMAIL }}
      SPELEODB_PASSWORD: ${{ secrets.SPELEODB_PASSWORD }}
      API_TEST_ENABLED: ${{ secrets.API_TEST_ENABLED }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --reporter=verbose --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Production Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  build-android:
    name: Build Android
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm ci
      - run: npx cap sync android
      - name: Generate temporary Android keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/ci-release.keystore"
          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -storepass "android" \
            -alias "ci-release-key" \
            -keypass "android" \
            -keyalg "RSA" \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SpeleoDB CI,OU=CI,O=SpeleoDB,L=San Francisco,S=CA,C=US"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASS=android"
            echo "ANDROID_KEY_ALIAS=ci-release-key"
            echo "ANDROID_KEY_ALIAS_PASS=android"
          } >> "$GITHUB_ENV"
      - name: Android Debug Build (APK)
        run: npx cap build android --androidreleasetype=APK --keystorepath="$ANDROID_KEYSTORE_PATH" --keystorepass="$ANDROID_KEYSTORE_PASS" --keystorealias="$ANDROID_KEY_ALIAS" --keystorealiaspass="$ANDROID_KEY_ALIAS_PASS"
      - name: Android Release Build (AAB)
        run: npx cap build android --androidreleasetype=AAB --keystorepath="$ANDROID_KEYSTORE_PATH" --keystorepass="$ANDROID_KEYSTORE_PASS" --keystorealias="$ANDROID_KEY_ALIAS" --keystorealiaspass="$ANDROID_KEY_ALIAS_PASS"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  build-ios:
    name: Build iOS
    needs: [build]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SENTRY_DSN_IOS: ${{ secrets.SENTRY_DSN_IOS }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm ci
      - run: npx cap sync ios
      - name: Generate temporary iOS signing key
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/ios-signing"
          CERT_KEY="$WORK_DIR/ci-ios.key"
          CERT_CRT="$WORK_DIR/ci-ios.crt"
          CERT_P12="$WORK_DIR/ci-ios.p12"
          OPENSSL_CFG="$WORK_DIR/openssl-codesign.cnf"
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-ios-keychain-pass"
          P12_PASSWORD="ci-ios-p12-pass"

          mkdir -p "$WORK_DIR"

          cat > "$OPENSSL_CFG" <<'EOF'
          [ req ]
          default_bits = 2048
          prompt = no
          default_md = sha256
          x509_extensions = codesign_ext
          distinguished_name = dn

          [ dn ]
          CN = SpeleoDB CI iOS Signing

          [ codesign_ext ]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid,issuer
          EOF

          openssl req -new -newkey rsa:2048 -nodes -x509 \
            -days 3650 \
            -config "$OPENSSL_CFG" \
            -keyout "$CERT_KEY" \
            -out "$CERT_CRT"
          openssl pkcs12 -export \
            -inkey "$CERT_KEY" \
            -in "$CERT_CRT" \
            -out "$CERT_P12" \
            -passout pass:"$P12_PASSWORD"

          echo "[ios-signing] create keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "[ios-signing] configure keychain timeout"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          echo "[ios-signing] unlock keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "[ios-signing] set default keychain"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          echo "[ios-signing] set keychain search list"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          echo "[ios-signing] import temporary certificate"
          security import "$CERT_P12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security

          echo "[ios-signing] resolve signing identity fingerprint"
          IOS_SIGNING_IDENTITY=$(openssl x509 -in "$CERT_CRT" -noout -fingerprint -sha1 | awk -F= '{print $2}' | tr -d ':')
          if [ -z "$IOS_SIGNING_IDENTITY" ]; then
            echo "Failed to resolve temporary iOS signing identity fingerprint from $CERT_CRT."
            exit 1
          fi

          {
            echo "IOS_SIGNING_IDENTITY=$IOS_SIGNING_IDENTITY"
            echo "IOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH"
            echo "IOS_SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: iOS release build (IPA)
        run: |
          set -euo pipefail

          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

          APP_PATH="App.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH"
            exit 1
          fi

          rm -rf output
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          security unlock-keychain -p "$IOS_SIGNING_KEYCHAIN_PASSWORD" "$IOS_SIGNING_KEYCHAIN"
          codesign --force --deep --keychain "$IOS_SIGNING_KEYCHAIN" --sign "$IOS_SIGNING_IDENTITY" --timestamp=none output/Payload/App.app
          codesign --verify --deep --strict output/Payload/App.app
          cd output
          zip -r App-temporary-signed.ipa Payload
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ios-ipa
          path: ios/App/output/*.ipa
          retention-days: 14

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts/android-apk
      - uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: artifacts/android-aab
      - uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: artifacts/ios-ipa
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/android-apk/*.apk
            artifacts/android-aab/*.aab
            artifacts/ios-ipa/*.ipa
