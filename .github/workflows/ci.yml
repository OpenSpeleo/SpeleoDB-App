name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize]
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prek:
    name: Prek Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run all prek hooks
        run: PREK_HOME="$RUNNER_TEMP/prek" npx prek run -a --show-diff-on-failure
      - name: Ensure hooks did not modify tracked files
        run: git diff --exit-code

  unit-tests:
    name: Full Vitest Suite
    needs: [prek]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPELEODB_INSTANCE_URL: ${{ secrets.SPELEODB_INSTANCE_URL }}
      SPELEODB_OAUTH_TOKEN: ${{ secrets.SPELEODB_OAUTH_TOKEN }}
      SPELEODB_EMAIL: ${{ secrets.SPELEODB_EMAIL }}
      SPELEODB_PASSWORD: ${{ secrets.SPELEODB_PASSWORD }}
      API_TEST_ENABLED: ${{ secrets.API_TEST_ENABLED }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test.unit -- --run --reporter=verbose --coverage --no-file-parallelism
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  web-build:
    name: Production Web Build
    needs: [prek, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  build-android:
    name: Android Release Compile Smoke
    needs: [web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID || 'https://public@example.invalid/1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm ci
      - run: npx cap sync android
      - name: Generate temporary Android keystore
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/ci-release.keystore"
          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -storepass "android" \
            -alias "ci-release-key" \
            -keypass "android" \
            -keyalg "RSA" \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SpeleoDB CI,OU=CI,O=SpeleoDB,L=San Francisco,S=CA,C=US"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASS=android"
            echo "ANDROID_KEY_ALIAS=ci-release-key"
            echo "ANDROID_KEY_ALIAS_PASS=android"
          } >> "$GITHUB_ENV"
      - name: Android CI smoke APK (temporary key)
        run: npx cap build android --androidreleasetype=APK --keystorepath="$ANDROID_KEYSTORE_PATH" --keystorepass="$ANDROID_KEYSTORE_PASS" --keystorealias="$ANDROID_KEY_ALIAS" --keystorealiaspass="$ANDROID_KEY_ALIAS_PASS"
      - name: Android CI smoke AAB (temporary key)
        run: npx cap build android --androidreleasetype=AAB --keystorepath="$ANDROID_KEYSTORE_PATH" --keystorepass="$ANDROID_KEYSTORE_PASS" --keystorealias="$ANDROID_KEY_ALIAS" --keystorealiaspass="$ANDROID_KEY_ALIAS_PASS"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: android-ci-smoke-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: android-ci-smoke-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

