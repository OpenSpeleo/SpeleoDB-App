  release-integrity:
    name: Confirm Tag Artifacts Are Smoke-Only
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - unit-tests
      - build-android
      # - build-ios # Temporarily disabled with the iOS job above.
    runs-on: ubuntu-latest
    steps:
      - name: Record release-integrity boundary
        run: |
          {
            echo "## Release integrity"
            echo
            echo "This tag passed the Android release-configuration compile smoke check."
            echo "The iOS release-configuration compile smoke check is temporarily disabled."
            echo "The retained workflow artifacts use disposable CI signing credentials."
            echo "They are not distributable releases and are not attached to a GitHub release."
            echo "Publishing requires a separate trusted-signing workflow plus installation verification."
          } >> "$GITHUB_STEP_SUMMARY"
