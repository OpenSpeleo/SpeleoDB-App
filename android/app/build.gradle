apply plugin: 'com.android.application'

android {
    namespace = "org.speleodb.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.speleodb.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 170
        versionName "1.7.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: '../capacitor-cordova-android-plugins/src/main/libs', include: ['*.jar', '*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

def repoRootDir = rootProject.projectDir.parentFile.absolutePath

def isWindowsHost() {
    return System.getProperty("os.name").toLowerCase().contains("win")
}

def resolveCommandFromCurrentPath(commandName) {
    try {
        def probeArgs = isWindowsHost() ? ["where", commandName] : ["which", commandName]
        def probe = new ProcessBuilder(probeArgs)
            .redirectErrorStream(true)
            .start()
        def outputLines = probe.inputStream
            .getText("UTF-8")
            .readLines()
            .collect { it.trim() }
            .findAll { it }

        if (probe.waitFor() == 0) {
            for (def line : outputLines) {
                def candidate = new File(line)
                if (candidate.exists() && candidate.canExecute()) {
                    return candidate.absolutePath
                }
            }
        }
    } catch (Exception ignored) {
        // Fall through and keep probing.
    }

    return null
}

def resolveCommandFromLoginShell(commandName) {
    if (isWindowsHost()) {
        return null
    }

    def candidateShells = [System.getenv("SHELL"), "/bin/zsh", "/bin/bash"]
        .findAll { it }
        .unique()

    for (def shellPath : candidateShells) {
        def shellFile = new File(shellPath)
        if (!shellFile.exists() || !shellFile.canExecute()) {
            continue
        }

        try {
            def shellProbe = new ProcessBuilder(shellPath, "-lc", "command -v ${commandName}")
                .redirectErrorStream(true)
                .start()
            def shellProbeOutput = shellProbe.inputStream.getText("UTF-8").trim()
            if (shellProbe.waitFor() == 0 && shellProbeOutput) {
                def directCandidate = new File(shellProbeOutput)
                if (directCandidate.exists() && directCandidate.canExecute()) {
                    return directCandidate.absolutePath
                }

                // Some shells can return a command name. Resolve again against current PATH.
                def resolvedFromCurrentPath = resolveCommandFromCurrentPath(shellProbeOutput)
                if (resolvedFromCurrentPath) {
                    return resolvedFromCurrentPath
                }
            }
        } catch (Exception ignored) {
            // Try the next shell.
        }
    }

    return null
}

def resolveBunBinary() {
    def explicitBunBinary = System.getenv("BUN_BINARY")?.trim()
    if (explicitBunBinary) {
        def explicitBunFile = new File(explicitBunBinary)
        if (explicitBunFile.exists() && explicitBunFile.canExecute()) {
            return explicitBunFile.absolutePath
        }

        // If BUN_BINARY is a command name (e.g. "bun"), resolve it to a concrete path.
        if (!explicitBunBinary.contains(File.separator) && !explicitBunBinary.contains("\\")) {
            def explicitFromCurrentPath = resolveCommandFromCurrentPath(explicitBunBinary)
            if (explicitFromCurrentPath) {
                return explicitFromCurrentPath
            }

            def explicitFromLoginShell = resolveCommandFromLoginShell(explicitBunBinary)
            if (explicitFromLoginShell) {
                return explicitFromLoginShell
            }
        }
    }

    def bunFromCurrentPath = resolveCommandFromCurrentPath("bun")
    if (bunFromCurrentPath) {
        return bunFromCurrentPath
    }

    // Android Studio often launches Gradle with a reduced PATH.
    // Use a login shell so Bun/Homebrew-managed installs are discoverable.
    def bunFromLoginShell = resolveCommandFromLoginShell("bun")
    if (bunFromLoginShell) {
        return bunFromLoginShell
    }

    def candidateBunPaths = [
        "/opt/homebrew/bin/bun",
        "/usr/local/bin/bun",
        "/usr/bin/bun",
    ]

    def userHome = System.getProperty("user.home")
    if (userHome) {
        candidateBunPaths.add("${userHome}${File.separator}.bun${File.separator}bin${File.separator}bun")
        candidateBunPaths.add("${userHome}${File.separator}.bun${File.separator}bin${File.separator}bun.exe")
    }

    for (def candidatePath : candidateBunPaths) {
        def candidateFile = new File(candidatePath)
        if (candidateFile.exists() && candidateFile.canExecute()) {
            return candidatePath
        }
    }

    throw new RuntimeException(
        "[sentry] Bun not found for Android build. " +
        "Set BUN_BINARY to your Bun executable path (for example /opt/homebrew/bin/bun), " +
        "or launch Android Studio from a shell where Bun is available."
    )
}

tasks.register("buildWebAssetsWithAndroidSentry", Exec) {
    workingDir repoRootDir
    doFirst {
        def bunBinary = resolveBunBinary()
        logger.lifecycle("[sentry] Using Bun binary: ${bunBinary}")
        commandLine bunBinary, "scripts/build-native-assets.mjs", "android"
    }
}

preBuild.dependsOn("buildWebAssetsWithAndroidSentry")

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
