appId: org.speleodb.app
androidWebViewHierarchy: devtools
---
# Pending-operation logout acknowledgement
- launchApp:
    stopApp: false
- tapOn: Settings
- tapOn: Sign Out
- assertVisible: Pending offline operations will be lost
- assertVisible: You have 1 pending offline operation.*
- assertVisible:
    text: Wipe local data & Sign Out
    enabled: false
- tapOn: I understand that these pending offline operations.*
- assertVisible:
    text: Wipe local data & Sign Out
    enabled: true
- tapOn: Wipe local data & Sign Out
- extendedWaitUntil:
    visible: Sign in to your account
    timeout: 120000

# Post-logout relaunch remains signed out
- stopApp
- launchApp
- assertVisible: Sign in to your account
- assertNotVisible: Pending
