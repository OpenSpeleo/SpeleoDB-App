appId: org.speleodb.app
androidWebViewHierarchy: devtools
---
# Create durable pending operation
- launchApp:
    stopApp: false
- tapOn: Projects
- extendedWaitUntil:
    visible: ${SPELEODB_E2E_PROJECT_NAME}
    timeout: 120000
- tapOn: ${SPELEODB_E2E_PROJECT_NAME}
- repeat:
    times: 4
    commands:
      - doubleTapOn:
          point: 72%,34%
- longPressOn:
    point: 72%,34%
- extendedWaitUntil:
    visible: Map Point
    timeout: 30000
- tapOn: Create Landmark
- tapOn: Landmark name
- inputText: ${SPELEODB_E2E_LANDMARK_NAME}
- tapOn: Create
- runFlow:
    when:
      visible: Go Offline
    commands:
      - tapOn: Go Offline
- extendedWaitUntil:
    visible: Pending
    timeout: 60000
- killApp
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible: Go Offline
    commands:
      - tapOn: Go Offline
- tapOn: Pending
- assertVisible: 1 pending change
- assertVisible: ${SPELEODB_E2E_LANDMARK_NAME}
