repos:
  # -------------------------
  # Generic sanity checks
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # -------------------------
  # Markdown formatting
  # -------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
      - id: prettier
        name: prettier markdown
        types_or: [markdown]
        args: [--prose-wrap=always]
        # args: [--prose-wrap=always, --embedded-language-formatting=off]

  # ---------------------------
  # Application Linting & Check
  # ---------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint --fix on staged TS/TSX
        entry: npx eslint --fix
        language: system
        files: \.(ts|tsx)$
        pass_filenames: true

      - id: lockfile-sync
        # `npm ci --dry-run` exits non-zero when package.json and
        # package-lock.json are out of sync, without touching node_modules.
        # Only runs when a manifest actually changed in the commit.
        name: package-lock.json matches package.json
        entry: npm ci --dry-run --no-audit --no-fund --ignore-scripts --workspaces=false
        language: system
        files: ^(package\.json|package-lock\.json)$
        pass_filenames: false

      - id: typecheck
        name: TypeScript --noEmit
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        always_run: true

      - id: build
        # `npm run build` runs `tsc && vite build`, so it re-typechecks. The
        # extra ~2s is intentional: it catches the case where someone bypasses
        # the typecheck hook with --no-verify and then pushes.
        name: vite build (tsc + bundle)
        entry: npm run build
        language: system
        pass_filenames: false
        always_run: true
