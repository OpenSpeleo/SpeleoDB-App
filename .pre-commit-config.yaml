---
repos:
  # -------------------------
  # Generic sanity checks
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # -------------------------
  # Markdown formatting
  # -------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        name: prettier markdown
        entry: bun run --bun prettier --write --ignore-unknown
        language: bun
        language_version: system
        types_or: [markdown]
        args: [--prose-wrap=always]
        # args: [--prose-wrap=always, --embedded-language-formatting=off]

  # -------------------------
  # CI formatting
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Accept GitHub Actions `on` and capitalized YAML booleans.
        args:
          - --config-data
          - |
            extends: default
            rules:
              truthy:
                allowed-values: ['true', 'false', 'True', 'False', 'on']

  - repo: https://github.com/shenxianpeng/hadolint-pre-commit
    # This wrapper bundles Hadolint 2.15.1 in prek's isolated environment.
    rev: v2.15.1.2
    hooks:
      - id: hadolint
        # Allow latest image tags and distro-managed APT package versions.
        args:
          - --ignore
          - DL3007  # Allow `latest` Docker image tags.
          - --ignore
          - DL3008  # Allow APT packages without explicit version pins.

  # ---------------------------
  # Application Linting & Check
  # ---------------------------
  - repo: local
    hooks:
      - id: eslint
        name: eslint --fix on staged TS/TSX
        entry: bunx --bun eslint --fix
        language: system
        files: \.(ts|tsx)$
        pass_filenames: true

      - id: lockfile-sync
        # Isolate the standalone graph so a parent workspace cannot mask drift.
        name: bun.lock matches standalone package.json
        entry: bun scripts/check-lockfile.mjs
        language: system
        files: ^(package\.json|bun\.lock|bunfig\.toml)$
        pass_filenames: false

      - id: typecheck
        name: TypeScript --noEmit
        entry: bun run typecheck
        language: system
        pass_filenames: false
        always_run: true

      - id: build
        # `bun run build` runs the typecheck wrapper and Vite, so it
        # re-typechecks. The extra ~2s is intentional: it catches the case
        # where someone bypasses the typecheck hook with --no-verify and
        # then pushes.
        name: vite build (tsc + bundle)
        entry: bun run build
        language: system
        pass_filenames: false
        always_run: true
